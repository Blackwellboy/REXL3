name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag-and-attach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish a release for every newly promoted approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            base=HEAD~1
          else
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          changed="$(git diff --name-only "$base" HEAD | grep -E '^runtimes/[^/]+/v[0-9]+/approval\.json$' || true)"
          if [ -z "$changed" ]; then
            echo "no newly promoted approval in this push"
            exit 0
          fi
          printf '%s\n' "$changed" | while read -r path; do
                dir="$(dirname "$path")"
                id="$(basename "$(dirname "$dir")")"
                ver="$(basename "$dir")"
                tag="prod/${id}/${ver}"
                dev_tag="approve-${id}-${ver#v}"
                if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                  echo "$tag already exists; refusing to overwrite" >&2
                  exit 1
                fi
                rm -rf /tmp/assets && mkdir -p /tmp/assets
                gh release download "$dev_tag" -R REXL3/REXL3-dev -D /tmp/assets --pattern '*.tar.gz'
                gh release create "$tag" /tmp/assets/*.tar.gz "$dir/approval.json" \
                  -R "$GITHUB_REPOSITORY" \
                  --title "${id} ${ver}" \
                  --notes "Promoted from ${dev_tag}. Archive bytes are identical to the dev release; approval.json names the commit, template and gates."
                echo "published $tag"
              done
