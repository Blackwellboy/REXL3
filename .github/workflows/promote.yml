name: promote
on:
  workflow_dispatch:
    inputs:
      runtime_id:
        description: "runtime id, e.g. dsv41-flash-1017-sage-1.62"
        required: true
      approve_tag:
        description: "dev release tag, e.g. approve-dsv41-flash-1017-sage-1.62-1"
        required: true
      version:
        description: "production version number, e.g. 1"
        required: true
permissions:
  contents: write
  pull-requests: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the dev approval and verify the archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/approve
          gh release download "${{ inputs.approve_tag }}" -R REXL3/REXL3-dev -D /tmp/approve
          python3 - <<'PY'
          import hashlib, json, pathlib
          d = pathlib.Path("/tmp/approve")
          approval = json.loads((d / "approval.json").read_text())
          archive = d / approval["bundle"]["archive"]
          got = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert got == approval["bundle"]["sha256"], f"archive sha256 {got} != approved {approval['bundle']['sha256']}"
          assert archive.stat().st_size == approval["bundle"]["bytes"], "archive size differs from the approval"
          approved = json.loads(pathlib.Path("runtimes/templates/APPROVED.json").read_text())["templates"]
          tpl = approval["template"]
          assert approved.get(tpl["version"]) == tpl["digest"], "template is not approved in production"
          assert approval["schema"] == "rexl3.profile-approval.v1", "unknown approval schema"
          print("verified", approval["runtime_id"], approval["source_commit"][:12], tpl["version"])
          PY
      - name: Materialise the approved tree
        run: |
          set -euo pipefail
          dst="runtimes/${{ inputs.runtime_id }}/v${{ inputs.version }}"
          mkdir -p "$dst"
          tar -xzf /tmp/approve/*.tar.gz -C "$dst" --exclude='bin/*' --exclude='release.lock.json'
          cp /tmp/approve/approval.json "$dst/approval.json"
          echo "v${{ inputs.version }}" > "runtimes/${{ inputs.runtime_id }}/LATEST"
          python3 tools/verify_runtime_tree.py --root .
      - name: Open the promotion pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="promote/${{ inputs.runtime_id }}-v${{ inputs.version }}"
          git config user.name "rexl3-promote"
          git config user.email "rexl3-promote@users.noreply.github.com"
          git checkout -b "$branch"
          git add runtimes/
          git commit -m "promote ${{ inputs.runtime_id }} v${{ inputs.version }} from ${{ inputs.approve_tag }}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "promote ${{ inputs.runtime_id }} v${{ inputs.version }}" \
            --body "Sealed by ${{ inputs.approve_tag }}. The archive hash, its size and the template digest were verified before this branch existed."
          gh pr merge "$branch" --rebase --auto || {
            echo "auto-merge is unavailable; merge the pull request once verify is green" >&2; }
